<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pastel Toca Dollhouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --outline: #4A3238;
            --pink-light: #FFE3EE;
            --pink-mid: #FFB8D2;
            --pink-deep: #F79AC0;
            --lav-light: #E8D7F9;
            --lav-mid: #C9A4EB;
            --lav-deep: #A87CE0;
            --cream: #FFF8F2;
            --wood: #D9A077;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #FFF4F9 0%, #F7E4F8 55%, #ECD5F4 100%);
            color: var(--outline);
            margin: 0;
            padding: 0;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
        }

        /* Tactile Toca-style Buttons */
        .toca-btn {
            border: 2.5px solid var(--outline);
            box-shadow: 0 3px 0 var(--outline);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
        }

        .toca-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 0 var(--outline);
        }

        .toca-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--outline);
        }

        .toca-btn-active {
            background-color: #FFB8D2 !important;
            transform: translateY(1px);
            box-shadow: 0 2px 0 var(--outline);
        }

        /* Dollhouse Stage Container */
        #stage-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px 12px 12px;
            position: relative;
        }

        #dollhouse-stage {
            position: relative;
            width: 100%;
            max-width: 1080px;
            aspect-ratio: 1000 / 620;
            max-height: 100%;
            border-radius: 26px;
            border: 4px solid var(--outline);
            box-shadow: 0 14px 36px rgba(74, 50, 56, 0.18), 0 6px 0 var(--outline);
            overflow: hidden;
            background-color: #FFF8F2;
        }

        #room-bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        #items-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Placed Draggable Items */
        .stage-item {
            position: absolute;
            cursor: grab;
            touch-action: none;
            transform-origin: center center;
            transition: filter 0.15s ease, opacity 0.2s ease, transform 0.2s ease;
            filter: drop-shadow(0 3px 3px rgba(74, 50, 56, 0.15));
        }

        .stage-item svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
            pointer-events: none;
        }

        .stage-item.is-rug {
            filter: drop-shadow(0 1px 1px rgba(74, 50, 56, 0.1));
        }

        .stage-item.is-selected {
            filter: drop-shadow(0 0 0 #A87CE0) drop-shadow(0 0 7px rgba(168, 124, 224, 0.9));
        }

        .stage-item.is-dragging {
            cursor: grabbing;
            filter: drop-shadow(0 12px 14px rgba(74, 50, 56, 0.28));
            z-index: 9999 !important;
            transition: none;
        }

        .stage-item.dress-target {
            filter: drop-shadow(0 0 10px #FF7EB6) drop-shadow(0 0 18px #C9A4EB);
            animation: gentlePulse 0.55s ease-in-out infinite alternate;
        }

        .stage-item.fridge-target {
            filter: drop-shadow(0 0 10px #8BE0FF) drop-shadow(0 0 18px #C9A4EB);
        }

        /* Items tucked safely inside a closed fridge */
        .stage-item.hidden-in-fridge {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.75);
        }

        @keyframes gentlePulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes popIn {
            0% { transform: scale(0.2); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes sparkleBurst {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(1.25) rotate(25deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.55) rotate(45deg); opacity: 0; }
        }

        .sparkle-fx {
            position: absolute;
            width: 110px;
            height: 110px;
            pointer-events: none;
            z-index: 10000;
            animation: sparkleBurst 0.65s ease-out forwards;
        }

        /* Trash Bin Lid Animation */
        #trash-bin {
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s ease;
        }

        #trash-bin .trash-lid {
            transform-origin: 48px 18px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #trash-bin.trash-active {
            transform: scale(1.18);
            background-color: #FFCADF !important;
            border-color: #D9467A !important;
        }

        #trash-bin.trash-active .trash-lid {
            transform: rotate(34deg) translate(2px, -6px);
        }

        /* Catalog Drawer */
        #catalog-drawer {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
        }

        #catalog-drawer.drawer-closed {
            transform: translateY(105%);
            opacity: 0;
            pointer-events: none;
        }

        .catalog-card {
            border: 2.5px solid var(--outline);
            background: #FFFDF9;
            border-radius: 18px;
            box-shadow: 0 3px 0 rgba(74, 50, 56, 0.16);
            transition: transform 0.14s ease, background-color 0.15s ease;
        }

        .catalog-card:hover {
            transform: translateY(-3px);
            background: #FFF2F7;
        }

        .catalog-card:active {
            transform: scale(0.95);
        }

        /* Pretty Scrollbars */
        .pretty-scroll::-webkit-scrollbar {
            height: 7px;
            width: 7px;
        }
        .pretty-scroll::-webkit-scrollbar-track {
            background: #F9E6F2;
            border-radius: 99px;
        }
        .pretty-scroll::-webkit-scrollbar-thumb {
            background: #C9A4EB;
            border-radius: 99px;
            border: 1.5px solid #4A3238;
        }

        /* Floating Selection Toolbar */
        #item-toolbar {
            position: absolute;
            z-index: 8000;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background: #FFFDF9;
            border: 2.5px solid var(--outline);
            border-radius: 999px;
            box-shadow: 0 5px 14px rgba(74, 50, 56, 0.22), 0 3px 0 var(--outline);
            transform: translateX(-50%);
            white-space: nowrap;
        }

        #item-toolbar.visible {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="w-full px-3 pt-2 pb-1 flex flex-wrap items-center justify-between gap-2 max-w-[1104px] mx-auto z-30">
        <!-- Brand Badge -->

            <svg class="w-7 h-7 flex-shrink-0" viewBox="0 0 40 40">
                <path d="M5 19 L20 6 L35 19 Z" fill="#F79AC0" stroke="#4A3238" stroke-width="2.5" stroke-linejoin="round"/>

        <nav id="room-nav" class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pretty-scroll py-1 px-0.5"></nav>

        <!-- Utility Buttons (Reset, Clear, Sound) -->

            <button id="btn-reset-room" title="Reset Room Layout" class="toca-btn bg-[#E8D7F9] hover:bg-[#DEC3F7] px-2.5 py-1.5 rounded-xl flex items-center gap-1.5 text-xs sm:text-sm font-semibold">

                    <path d="M3 3v5h5"/>

            </button>

                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18M6 6l12 12"/>

                <span class="hidden md:inline">Clear</span>
            </button>

            <button id="btn-sound" title="Toggle Sound" class="toca-btn bg-[#FFFDF9] hover:bg-[#FFF0F6] p-1.5 rounded-xl flex items-center justify-center">
                <svg id="icon-sound-on" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#C9A4EB"/>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                    <path d="M18.8 5.5a9 9 0 0 1 0 13"/>

                <svg id="icon-sound-off" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

                    <line x1="22" y1="9" x2="16" y2="15"/>

        </div>
    </header>

    <!-- Main Dollhouse Stage -->
    <main id="stage-wrapper">
        <div id="dollhouse-stage">
            <!-- Inline SVG Room Background -->
            <div id="room-bg-layer"></div>

            <!-- Interactive Draggable Items Layer -->
            <div id="items-layer"></div>

            <!-- Floating Mini Selection Toolbar -->
            <div id="item-toolbar" aria-label="Item controls">
                <!-- Dynamic Interactive Toggle Button (Shown for Fridge, Oven, Toaster, Lamp) -->
                <button id="tool-interact" class="hidden h-8 px-2.5 rounded-full bg-[#B8E6FE] hover:bg-[#99DBFD] border-2 border-[#4A3238] flex items-center gap-1.5 text-xs font-bold text-[#4A3238] transition-transform active:scale-95">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="3" width="16" height="18" rx="3" fill="#FFFDF9"/>

                    </svg>
                    <span id="tool-interact-label">Open</span>

                <button id="tool-flip" title="Flip Horizontally" class="w-8 h-8 rounded-full bg-[#FFE3EE] hover:bg-[#FFB8D2] border-2 border-[#4A3238] flex items-center justify-center transition-transform active:scale-90">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v18"/>

                <button id="tool-front" title="Bring Forward" class="w-8 h-8 rounded-full bg-[#E8D7F9] hover:bg-[#C9A4EB] border-2 border-[#4A3238] flex items-center justify-center transition-transform active:scale-90">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 19V5"/>

                <button id="tool-back" title="Send Backward" class="w-8 h-8 rounded-full bg-[#E8D7F9] hover:bg-[#C9A4EB] border-2 border-[#4A3238] flex items-center justify-center transition-transform active:scale-90">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

                <button id="tool-delete" title="Delete Item" class="w-8 h-8 rounded-full bg-[#FFCADF] hover:bg-[#F79AC0] border-2 border-[#4A3238] flex items-center justify-center transition-transform active:scale-90">

            <!-- Prominent Catalog Toggle Button (Bottom-Left) -->
            <button id="btn-toggle-catalog" title="Open Furniture, Food & Dress-Up Catalog"
                class="toca-btn absolute bottom-3 left-3 sm:bottom-4 sm:left-4 z-40 bg-[#FFB8D2] hover:bg-[#FFA3C6] px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-2xl flex items-center gap-2 font-bold text-sm sm:text-base text-[#4A3238]">
                <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 36 36" fill="none">
                    <rect x="6" y="15" width="24" height="11" rx="4" fill="#E8D7F9" stroke="#4A3238" stroke-width="2.4"/>
                    <rect x="9" y="8" width="18" height="10" rx="4" fill="#C9A4EB" stroke="#4A3238" stroke-width="2.4"/>
                    <rect x="4" y="16" width="5" height="11" rx="2.5" fill="#A87CE0" stroke="#4A3238" stroke-width="2.2"/>
                    <rect x="27" y="16" width="5" height="11" rx="2.5" fill="#A87CE0" stroke="#4A3238" stroke-width="2.2"/>
                    <line x1="9" y1="26" x2="9" y2="31" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="27" y1="26" x2="27" y2="31" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round"/>
                    <circle cx="28" cy="9" r="6" fill="#FFFDF9" stroke="#4A3238" stroke-width="2.2"/>
                    <path d="M28 6.2V11.8M25.2 9H30.8" stroke="#4A3238" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
                <span>Catalog</span>
            </button>

            <!-- Custom SVG Trash Bin Drop Zone (Bottom-Right) -->
            <div id="trash-bin" title="Drag items here to delete"
                class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-40 w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-[#FFFDF9]/95 border-[3px] border-[#4A3238] shadow-[0_4px_0_#4A3238] flex items-center justify-center">
                <svg class="w-10 h-10 sm:w-11 sm:h-11 overflow-visible" viewBox="0 0 60 60" fill="none">
                    <path d="M16 22 H44 L41 49 C40.7 51.5 38.8 53 36.4 53 H23.6 C21.2 53 19.3 51.5 19 49 L16 22 Z" fill="#FFB8D2" stroke="#4A3238" stroke-width="3" stroke-linejoin="round"/>
                    <line x1="24" y1="29" x2="25" y2="46" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="30" y1="29" x2="30" y2="46" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round"/>
                    <line x1="36" y1="29" x2="35" y2="46" stroke="#4A3238" stroke-width="2.6" stroke-linecap="round"/>
                    <g class="trash-lid">
                        <rect x="12" y="15" width="36" height="6" rx="3" fill="#C9A4EB" stroke="#4A3238" stroke-width="3"/>
                        <path d="M24 15 V11 C24 9.5 25.3 8.5 27 8.5 H33 C34.7 8.5 36 9.5 36 11 V15" fill="#E8D7F9" stroke="#4A3238" stroke-width="3" stroke-linejoin="round"/>
                    </g>
                </svg>
            </div>

            <!-- Subtle Helper Pill -->
            <div id="toast-pill" class="pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-50 bg-[#FFFDF9]/95 border-2 border-[#4A3238] text-[#4A3238] text-xs sm:text-sm font-semibold px-4 py-1.5 rounded-full shadow-md opacity-0 transition-opacity duration-300 text-center max-w-[85%]">
                Tip: Double-tap the fridge to open it and store cupcakes inside!
            </div>
        </div>
    </main>

    <!-- Toggleable Bottom Catalog Drawer -->
    <section id="catalog-drawer" class="drawer-closed fixed bottom-0 left-0 right-0 z-50 max-w-[1104px] mx-auto px-2 sm:px-4">
        <div class="bg-[#FFF8F2] border-t-4 border-x-4 border-[#4A3238] rounded-t-3xl shadow-[0_-12px_30px_rgba(74,50,56,0.22)] flex flex-col">
            <!-- Drawer Header & 6 Category Tabs -->
            <div class="flex items-center justify-between gap-2 px-3 sm:px-4 py-2.5 bg-[#FFE3EE] rounded-t-[20px] border-b-[3px] border-[#4A3238]">
                <div id="catalog-tabs" class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pretty-scroll py-0.5"></div>
                <button id="btn-close-catalog" title="Close Catalog" class="toca-btn flex-shrink-0 w-9 h-9 rounded-full bg-[#FFFDF9] hover:bg-[#E8D7F9] flex items-center justify-center">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#4A3238" stroke-width="2.8" stroke-linecap="round">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
            </div>

            <!-- Catalog Scrollable Items Strip -->
            <div id="catalog-grid" class="flex items-center gap-3 px-4 py-3 overflow-x-auto pretty-scroll min-h-[126px] sm:min-h-[138px]"></div>
        </div>
    </section>

    <!-- Custom In-App Confirmation Modal (No native confirm/alert) -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[100] bg-[#4A3238]/40 backdrop-blur-[2px] flex items-center justify-center p-4">
        <div class="bg-[#FFFDF9] border-4 border-[#4A3238] rounded-3xl shadow-[0_8px_0_#4A3238] max-w-sm w-full p-5 text-center">
            <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-[#FFE3EE] border-[2.5px] border-[#4A3238] flex items-center justify-center">
                <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" stroke="#4A3238" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 5 L28 26 H4 Z" fill="#FFB8D2"/>
                    <line x1="16" y1="13" x2="16" y2="19"/>
                    <circle cx="16" cy="23" r="1.2" fill="#4A3238"/>
                </svg>
            </div>
            <h2 id="confirm-title" class="text-lg font-bold text-[#4A3238] mb-1">Clear This Room?</h2>
            <p id="confirm-msg" class="text-sm text-[#6E4D56] mb-5">This will remove all items from the current room.</p>
            <div class="flex justify-center gap-3">
                <button id="confirm-cancel" class="toca-btn bg-[#E8D7F9] px-5 py-2 rounded-xl font-bold text-sm">Cancel</button>
                <button id="confirm-ok" class="toca-btn bg-[#F79AC0] px-5 py-2 rounded-xl font-bold text-sm">Yes, Do It</button>
            </div>
        </div>
    </div>

    <script>
    (() => {
        'use strict';

        // =========================================================================
        // 1. GENTLE WEB AUDIO SYNTHESIZER (Zero External Audio URLs)
        // =========================================================================
        const SoundFX = (() => {
            let ctx = null;
            let muted = false;

            function getCtx() {
                if (muted) return null;
                if (!ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) ctx = new AudioCtx();
                }
                if (ctx && ctx.state === 'suspended') ctx.resume();
                return ctx;
            }

            function playTone(freq, endFreq, duration, type = 'sine', vol = 0.08) {
                try {
                    const ac = getCtx();
                    if (!ac) return;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ac.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, ac.currentTime + duration);
                    gain.gain.setValueAtTime(vol, ac.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ac.destination);
                    osc.start();
                    osc.stop(ac.currentTime + duration);
                } catch (_) {}
            }

            return {
                pop: () => playTone(380, 620, 0.11, 'sine', 0.09),
                pickup: () => playTone(440, 560, 0.07, 'triangle', 0.06),
                drop: () => playTone(340, 260, 0.08, 'sine', 0.07),
                doorOpen: () => {
                    playTone(280, 460, 0.12, 'sine', 0.08);
                    setTimeout(() => playTone(520, 660, 0.09, 'sine', 0.05), 60);
                },
                doorClose: () => playTone(420, 190, 0.12, 'triangle', 0.09),
                toastPop: () => {
                    playTone(500, 920, 0.11, 'triangle', 0.09);
                    setTimeout(() => playTone(880, 1180, 0.08, 'sine', 0.06), 70);
                },
                lightClick: () => playTone(680, 520, 0.05, 'square', 0.04),
                trash: () => playTone(320, 140, 0.16, 'triangle', 0.09),
                sparkle: () => {

                ]

        ];

        // =========================================================================
        // 5. APPLICATION STATE & ROOM PERSISTENCE
        // =========================================================================
        let currentRoomId = 'kitchen';
        let activeCatalogTab = 'appliances';
        let isCatalogOpen = false;
        let selectedItemId = null;
        let nextUid = 1;
        let maxZ = 50;

        const roomStates = {};

        function buildStarterState(roomId) {
            const room = ROOMS.find(r => r.id === roomId);
            if (!room) return [];
            return room.starter.map((entry, idx) => {
                const def = ITEM_CATALOG[entry.type];
                let z = 15 + idx;
                if (def.isRug) z = 2 + idx;
                else if (def.isCharacter) z = 40 + idx;
                return {
                    id: `item_${nextUid++}`,
                    type: entry.type,
                    x: entry.x,
                    y: entry.y,
                    flip: Boolean(entry.flip),
                    z,
                    isOpen: Boolean(entry.isOpen),
                    storedIn: null,
                    relX: 0,
                    relY: 0,
                    outfitId: entry.outfitId || (def.isCharacter ? CHARACTER_DEFS[entry.type].defaultOutfit : null)
                };
            });
        }

        ROOMS.forEach(r => {
            roomStates[r.id] = buildStarterState(r.id);
        });

        // =========================================================================
        // 6. DOM REFERENCES
        // =========================================================================
        const stageEl = document.getElementById('dollhouse-stage');
        const roomBgLayer = document.getElementById('room-bg-layer');
        const itemsLayer = document.getElementById('items-layer');
        const roomNavEl = document.getElementById('room-nav');

        const catalogGridEl = document.getElementById('catalog-grid');

        const btnCloseCatalog = document.getElementById('btn-close-catalog');
        const trashBinEl = document.getElementById('trash-bin');

        const toolInteractBtn = document.getElementById('tool-interact');
        const toolInteractLabel = document.getElementById('tool-interact-label');
        const toastPill = document.getElementById('toast-pill');

        const confirmModal = document.getElementById('confirm-modal');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMsg = document.getElementById('confirm-msg');
        const confirmCancel = document.getElementById('confirm-cancel');
        const confirmOk = document.getElementById('confirm-ok');
        let pendingConfirmAction = null;

        let toastTimer = null;
        function showToast(text) {
            toastPill.textContent = text;
            toastPill.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastPill.style.opacity = '0';
            }, 2900);
        }

        // =========================================================================
        // 7. ROOM & ITEM RENDERING + FRIDGE STORAGE VISIBILITY
        // =========================================================================
        function renderRoomNav() {
            roomNavEl.innerHTML = '';
            ROOMS.forEach(room => {
                const btn = document.createElement('button');
                const active = room.id === currentRoomId;
                btn.className = `toca-btn flex-shrink-0 px-2.5 sm:px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-xs sm:text-sm font-bold ${
                    active ? 'toca-btn-active' : 'bg-[#FFFDF9] hover:bg-[#FFF0F6]'
                }`;
                btn.innerHTML = `${room.icon}<span>${room.name}</span>`;
                btn.addEventListener('click', () => {
                    if (currentRoomId === room.id) return;
                    SoundFX.pop();
                    currentRoomId = room.id;
                    deselectItem();
                    renderRoomNav();
                    renderActiveRoom();
                });
                roomNavEl.appendChild(btn);
            });
        }

        function renderActiveRoom() {
            const room = ROOMS.find(r => r.id === currentRoomId);
            if (!room) return;
            roomBgLayer.innerHTML = room.bgSVG;
            itemsLayer.innerHTML = '';

            const items = roomStates[currentRoomId] || [];
            items.forEach(item => {
                const el = createItemElement(item);
                itemsLayer.appendChild(el);
            });
            syncAllStoredItemsVisibility();
            updateToolbarPosition();
        }

        function createItemElement(item, animatePop = false) {
            const def = ITEM_CATALOG[item.type];
            const el = document.createElement('div');
            el.className = 'stage-item';
            if (def.isRug) el.classList.add('is-rug');
            if (animatePop) el.classList.add('animate-pop');
            if (item.id === selectedItemId) el.classList.add('is-selected');

            el.dataset.id = item.id;
            el.style.left = `${item.x}%`;
            el.style.top = `${item.y}%`;
            el.style.width = `${def.w}%`;
            el.style.height = `${def.h}%`;
            el.style.zIndex = item.z;

            const inner = document.createElement('div');
            inner.className = 'w-full h-full pointer-events-none';
            inner.style.transform = item.flip ? 'scaleX(-1)' : 'scaleX(1)';
            inner.innerHTML = getItemSVG(item.type, item);
            el.appendChild(inner);

            el.addEventListener('pointerdown', (e) => handleItemPointerDown(e, item, el));
            el.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (def.interactive) {
                    toggleInteractiveItem(item);
                }
            });
            return el;
        }

        function toggleInteractiveItem(item) {
            const def = ITEM_CATALOG[item.type];
            if (!def || !def.interactive) return;

            item.isOpen = !item.isOpen;

            if (def.interactive === 'fridge' || def.interactive === 'oven') {
                item.isOpen ? SoundFX.doorOpen() : SoundFX.doorClose();
            } else if (def.interactive === 'toaster') {
                item.isOpen ? SoundFX.toastPop() : SoundFX.drop();
            } else if (def.interactive === 'lamp') {
                SoundFX.lightClick();
            }

            const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
            if (el && el.firstChild) {
                el.firstChild.innerHTML = getItemSVG(item.type, item);
            }

            if (def.interactive === 'fridge') {
                syncAllStoredItemsVisibility();
                const storedCount = (roomStates[currentRoomId] || []).filter(it => it.storedIn === item.id).length;
                if (item.isOpen) {
                    showToast(storedCount > 0 ? `Fridge opened! (${storedCount} item${storedCount > 1 ? 's' : ''} inside)` : 'Fridge opened! Drag food or dishes onto the shelves.');
                } else {
                    showToast(storedCount > 0 ? `Fridge closed! ${storedCount} item${storedCount > 1 ? 's' : ''} tucked safely inside.` : 'Fridge closed!');
                }
            }
            updateToolbarPosition();
        }

        function syncAllStoredItemsVisibility() {
            const items = roomStates[currentRoomId] || [];
            items.forEach(item => {
                if (!item.storedIn) return;
                const fridge = items.find(f => f.id === item.storedIn);
                const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
                if (!fridge || !el) return;

                if (fridge.isOpen) {
                    el.classList.remove('hidden-in-fridge');
                    if (item.z <= fridge.z) {
                        item.z = fridge.z + 2;
                        el.style.zIndex = item.z;
                    }
                } else {
                    el.classList.add('hidden-in-fridge');
                    if (selectedItemId === item.id) deselectItem();
                }
            });
        }

        function spawnSparkle(stageXPercent, stageYPercent) {
            const fx = document.createElement('div');

            fx.innerHTML = `<svg viewBox="0 0 100 100" fill="none">

            </svg>`;
            stageEl.appendChild(fx);
            setTimeout(() => fx.remove(), 680);
        }

        // =========================================================================

        // =========================================================================
        const CATALOG_TABS = [
            {

        function renderCatalogTabs() {
            catalogTabsEl.innerHTML = '';
            CATALOG_TABS.forEach(tab => {
                const btn = document.createElement('button');
                const active = tab.id === activeCatalogTab;
                btn.className = `toca-btn flex-shrink-0 px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-xs sm:text-sm font-bold ${
                    active ? 'bg-[#C9A4EB] translate-y-[1px]' : 'bg-[#FFFDF9] hover:bg-[#FFF0F6]'
                }`;
                btn.innerHTML = `${tab.icon}<span>${tab.label}</span>`;
                btn.addEventListener('click', () => {
                    SoundFX.pop();
                    activeCatalogTab = tab.id;
                    renderCatalogTabs();
                    renderCatalogGrid();
                });
                catalogTabsEl.appendChild(btn);
            });
        }

        function renderCatalogGrid() {
            catalogGridEl.innerHTML = '';
            Object.entries(ITEM_CATALOG).forEach(([type, def]) => {
                if (def.category !== activeCatalogTab) return;
                const card = document.createElement('button');
                card.className = 'catalog-card flex-shrink-0 w-24 h-24 sm:w-28 sm:h-28 p-2 flex flex-col items-center justify-between cursor-pointer';
                card.innerHTML = `
                    <div class="w-full h-14 sm:h-16 flex items-center justify-center pointer-events-none">
                        ${getItemSVG(type, { isOpen: false })}
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-[#4A3238] leading-tight truncate w-full text-center">${def.name}</span>
                `;
                const previewSvg = card.querySelector('svg');
                if (previewSvg) {
                    previewSvg.style.maxWidth = '100%';
                    previewSvg.style.maxHeight = '100%';
                    previewSvg.style.width = 'auto';
                    previewSvg.style.height = 'auto';
                }
                card.addEventListener('click', () => spawnCatalogItem(type));
                catalogGridEl.appendChild(card);
            });
        }

        function spawnCatalogItem(type) {
            const def = ITEM_CATALOG[type];
            if (!def) return;
            SoundFX.pop();

            const jitterX = (Math.random() - 0.5) * 10;
            const jitterY = (Math.random() - 0.5) * 8;
            const startX = Math.max(4, Math.min(96 - def.w, 50 - def.w / 2 + jitterX));
            const startY = Math.max(8, Math.min(94 - def.h, (def.isRug ? 74 : 56) - def.h / 2 + jitterY));

            const z = def.isRug ? 3 : ++maxZ;
            const newItem = {
                id: `item_${nextUid++}`,
                type,
                x: startX,
                y: startY,
                flip: false,
                z,
                isOpen: def.interactive === 'lamp',
                storedIn: null,
                relX: 0,
                relY: 0,
                outfitId: def.isCharacter ? CHARACTER_DEFS[type].defaultOutfit : null
            };

            roomStates[currentRoomId].push(newItem);
            const el = createItemElement(newItem, true);
            itemsLayer.appendChild(el);
            selectItem(newItem.id);

            if (def.isOutfit) {
                showToast('Drag this outfit onto any character to dress them!');
            } else if (def.interactive === 'fridge') {
                showToast('Tap Open or double-tap the fridge to store food inside!');
            }
        }

        function setCatalogOpen(open) {
            isCatalogOpen = open;
            catalogDrawer.classList.toggle('drawer-closed', !open);
        }

        btnToggleCatalog.addEventListener('click', () => {
            SoundFX.pop();
            setCatalogOpen(!isCatalogOpen);
        });
        btnCloseCatalog.addEventListener('click', () => {
            SoundFX.pop();
            setCatalogOpen(false);
        });

        // =========================================================================
        // 9. SELECTION & FLOATING MINI TOOLBAR
        // =========================================================================
        function getItemById(id) {
            return (roomStates[currentRoomId] || []).find(it => it.id === id);
        }

        function selectItem(id) {
            selectedItemId = id;
            itemsLayer.querySelectorAll('.stage-item').forEach(el => {
                el.classList.toggle('is-selected', el.dataset.id === id);
            });
            updateToolbarPosition();
        }

        function deselectItem() {
            selectedItemId = null;
            itemsLayer.querySelectorAll('.stage-item.is-selected').forEach(el => el.classList.remove('is-selected'));
            itemToolbar.classList.remove('visible');
        }

        function updateToolbarPosition() {
            if (!selectedItemId) {
                itemToolbar.classList.remove('visible');
                return;
            }
            const item = getItemById(selectedItemId);
            const el = itemsLayer.querySelector(`[data-id="${selectedItemId}"]`);
            if (!item || !el) {
                itemToolbar.classList.remove('visible');
                return;
            }
            const def = ITEM_CATALOG[item.type];

            // Show or hide the interactive action button (Fridge / Oven / Toaster / Lamp)
            if (def.interactive) {
                toolInteractBtn.classList.remove('hidden');
                toolInteractLabel.textContent = item.isOpen ? def.closeLabel : def.openLabel;
            } else {
                toolInteractBtn.classList.add('hidden');
            }

            const centerX = Math.max(18, Math.min(82, item.x + def.w / 2));
            const topPos = item.y > 16 ? item.y - 9.5 : item.y + def.h + 2;
            itemToolbar.style.left = `${centerX}%`;
            itemToolbar.style.top = `${Math.max(4, Math.min(84, topPos))}%`;
            itemToolbar.classList.add('visible');
        }

        toolInteractBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const item = getItemById(selectedItemId);
            if (item) toggleInteractiveItem(item);
        });

        document.getElementById('tool-flip').addEventListener('click', (e) => {
            e.stopPropagation();
            const item = getItemById(selectedItemId);
            if (!item) return;
            SoundFX.pop();
            item.flip = !item.flip;
            const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
            if (el && el.firstChild) {
                el.firstChild.style.transform = item.flip ? 'scaleX(-1)' : 'scaleX(1)';
            }
        });

        document.getElementById('tool-front').addEventListener('click', (e) => {
            e.stopPropagation();
            const item = getItemById(selectedItemId);
            if (!item) return;
            SoundFX.pop();
            item.z = ++maxZ;
            const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
            if (el) el.style.zIndex = item.z;
            syncAllStoredItemsVisibility();
        });

        document.getElementById('tool-back').addEventListener('click', (e) => {
            e.stopPropagation();
            const item = getItemById(selectedItemId);
            if (!item) return;
            SoundFX.pop();
            const def = ITEM_CATALOG[item.type];
            item.z = Math.max(def.isRug ? 1 : 6, item.z - 5);
            const el = itemsLayer.querySelector(`[data-id="${item.id}"]`);
            if (el) el.style.zIndex = item.z;
        });

        document.getElementById('tool-delete').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!selectedItemId) return;
            deleteItemById(selectedItemId);
        });

        function deleteItemById(id) {
            SoundFX.trash();
            const items = roomStates[currentRoomId] || [];
            // Also remove any items stored inside this fridge if deleting a fridge
            const toRemoveIds = new Set([id]);
            items.forEach(it => {
                if (it.storedIn === id) toRemoveIds.add(it.id);
            });

            roomStates[currentRoomId] = items.filter(it => !toRemoveIds.has(it.id));
            if (toRemoveIds.has(selectedItemId)) deselectItem();

            toRemoveIds.forEach(remId => {
                const el = itemsLayer.querySelector(`[data-id="${remId}"]`);
                if (el) {
                    el.style.pointerEvents = 'none';
                    el.animate([
                        { transform: 'scale(1) rotate(0deg)', opacity: 1 },
                        { transform: 'scale(0.1) rotate(24deg)', opacity: 0 }
                    ], { duration: 220, easing: 'ease-in' }).onfinish = () => el.remove();
                }
            });
        }

        stageEl.addEventListener('pointerdown', (e) => {
            if (e.target === stageEl || e.target === itemsLayer) {
                deselectItem();
            }
        });

        // =========================================================================
        // 10. POINTER-EVENT DRAG & DROP + FRIDGE STORAGE + DRESS-UP + TRASH BIN
        // =========================================================================
        let dragState = null;

        function handleItemPointerDown(e, item, el) {
            if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
            e.stopPropagation();

            const elRect = el.getBoundingClientRect();

            SoundFX.pickup();
            selectItem(item.id);
            itemToolbar.classList.remove('visible');

            const def = ITEM_CATALOG[item.type];
            if (!def.isRug) {
                item.z = ++maxZ;
                el.style.zIndex = item.z;
            }

            el.classList.add('is-dragging');
            el.setPointerCapture(e.pointerId);

            dragState = {
                item,
                el,
                def,
                pointerId: e.pointerId,
                offsetX: e.clientX - elRect.left,
                offsetY: e.clientY - elRect.top,
                hoveredCharId: null,
                hoveredFridgeId: null
            };

            el.addEventListener('pointermove', handlePointerMove);
            el.addEventListener('pointerup', handlePointerUp);
            el.addEventListener('pointercancel', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (!dragState || e.pointerId !== dragState.pointerId) return;
            e.preventDefault();

            const { item, el, def, offsetX, offsetY } = dragState;
            const stageRect = stageEl.getBoundingClientRect();

            let xPct = ((e.clientX - stageRect.left - offsetX) / stageRect.width) * 100;
            let yPct = ((e.clientY - stageRect.top - offsetY) / stageRect.height) * 100;

            xPct = Math.max(-2, Math.min(102 - def.w, xPct));
            yPct = Math.max(-2, Math.min(102 - def.h, yPct));

            item.x = xPct;
            item.y = yPct;
            el.style.left = `${xPct}%`;
            el.style.top = `${yPct}%`;

            // If dragging a fridge, move any items stored inside it along with it!
            if (def.interactive === 'fridge') {
                (roomStates[currentRoomId] || []).forEach(child => {
                    if (child.storedIn === item.id) {
                        child.x = item.x + child.relX;
                        child.y = item.y + child.relY;
                        const childEl = itemsLayer.querySelector(`[data-id="${child.id}"]`);
                        if (childEl) {
                            childEl.style.left = `${child.x}%`;
                            childEl.style.top = `${child.y}%`;
                            if (item.isOpen) {
                                child.z = item.z + 2;
                                childEl.style.zIndex = child.z;
                            }
                        }
                    }
                });
            }

            // Trash Bin Hover Check
            const overTrash = isPointOverElement(e.clientX, e.clientY, trashBinEl, 10);
            trashBinEl.classList.toggle('trash-active', overTrash);

            // Dress-Up Target Hover Check
            if (def.isOutfit) {
                const targetChar = findTargetUnderPoint(e.clientX, e.clientY, it => ITEM_CATALOG[it.type]?.isCharacter);
                if (dragState.hoveredCharId !== (targetChar ? targetChar.id : null)) {
                    clearHighlights();
                    if (targetChar) {
                        const charEl = itemsLayer.querySelector(`[data-id="${targetChar.id}"]`);
                        if (charEl) charEl.classList.add('dress-target');
                    }
                    dragState.hoveredCharId = targetChar ? targetChar.id : null;
                }
            }

            // Open Fridge Storage Hover Check
            if (def.canStoreInFridge) {
                const targetFridge = findTargetUnderPoint(
                    e.clientX,
                    e.clientY,
                    it => ITEM_CATALOG[it.type]?.interactive === 'fridge' && it.isOpen
                );
                if (dragState.hoveredFridgeId !== (targetFridge ? targetFridge.id : null)) {
                    clearHighlights();
                    if (targetFridge) {
                        const fEl = itemsLayer.querySelector(`[data-id="${targetFridge.id}"]`);
                        if (fEl) fEl.classList.add('fridge-target');
                    }
                    dragState.hoveredFridgeId = targetFridge ? targetFridge.id : null;
                }
            }
        }

        function handlePointerUp(e) {
            if (!dragState || e.pointerId !== dragState.pointerId) return;
            const { item, el, def, hoveredCharId, hoveredFridgeId } = dragState;

            el.removeEventListener('pointermove', handlePointerMove);
            el.removeEventListener('pointerup', handlePointerUp);
            el.removeEventListener('pointercancel', handlePointerUp);
            try { el.releasePointerCapture(e.pointerId); } catch (_) {}

            el.classList.remove('is-dragging');
            trashBinEl.classList.remove('trash-active');
            clearHighlights();

            const overTrash = isPointOverElement(e.clientX, e.clientY, trashBinEl, 10);
            dragState = null;

            if (overTrash) {
                deleteItemById(item.id);
                return;
            }

            // Snap Outfit onto Character
            if (def.isOutfit && hoveredCharId) {
                const targetChar = getItemById(hoveredCharId);
                if (targetChar) {
                    targetChar.outfitId = item.type;
                    const charEl = itemsLayer.querySelector(`[data-id="${targetChar.id}"]`);
                    if (charEl && charEl.firstChild) {
                        charEl.firstChild.innerHTML = getItemSVG(targetChar.type, targetChar);
                        charEl.animate([
                            { transform: 'scale(1)' },
                            { transform: 'scale(1.12)' },
                            { transform: 'scale(1)' }
                        ], { duration: 280, easing: 'ease-out' });
                    }
                    const charDef = ITEM_CATALOG[targetChar.type];
                    spawnSparkle(targetChar.x + charDef.w / 2, targetChar.y + charDef.h / 2);
                    SoundFX.sparkle();

                    roomStates[currentRoomId] = roomStates[currentRoomId].filter(it => it.id !== item.id);
                    el.remove();
                    selectItem(targetChar.id);
                    showToast(`${CHARACTER_DEFS[targetChar.type].name} loves the ${def.name}!`);
                    return;
                }
            }

            // Store Food / Tabletop Item Inside Open Fridge (or detach if dragged out)
            if (def.canStoreInFridge) {
                if (hoveredFridgeId) {
                    const fridge = getItemById(hoveredFridgeId);
                    if (fridge && fridge.isOpen) {
                        const fDef = ITEM_CATALOG[fridge.type];
                        // Clamp gently inside the fridge shelf interior
                        const minX = fridge.x + fDef.w * 0.16;
                        const maxX = fridge.x + fDef.w * 0.84 - def.w;
                        const minY = fridge.y + fDef.h * 0.14;
                        const maxY = fridge.y + fDef.h * 0.80 - def.h;
                        item.x = Math.max(minX, Math.min(maxX, item.x));
                        item.y = Math.max(minY, Math.min(maxY, item.y));
                        item.storedIn = fridge.id;
                        item.relX = item.x - fridge.x;
                        item.relY = item.y - fridge.y;
                        item.z = Math.max(fridge.z + 2, ++maxZ);

                        el.style.left = `${item.x}%`;
                        el.style.top = `${item.y}%`;
                        el.style.zIndex = item.z;
                        SoundFX.pop();
                        showToast(`Stored ${def.name} in the fridge! Close the door to tuck it away.`);
                        updateToolbarPosition();
                        return;
                    }
                } else if (item.storedIn) {
                    item.storedIn = null;
                    item.relX = 0;
                    item.relY = 0;
                }
            }

            if (def.interactive === 'fridge') {
                syncAllStoredItemsVisibility();
            }

            SoundFX.drop();
            updateToolbarPosition();
        }

        function isPointOverElement(clientX, clientY, targetEl, pad = 0) {
            const r = targetEl.getBoundingClientRect();
            return (
                clientX >= r.left - pad &&
                clientX <= r.right + pad &&
                clientY >= r.top - pad &&
                clientY <= r.bottom + pad
            );
        }

        function findTargetUnderPoint(clientX, clientY, predicate) {
            const items = (roomStates[currentRoomId] || [])
                .filter(predicate)
                .sort((a, b) => b.z - a.z);

            for (const it of items) {
                const itEl = itemsLayer.querySelector(`[data-id="${it.id}"]`);
                if (itEl && isPointOverElement(clientX, clientY, itEl, 8)) {
                    return it;
                }
            }
            return null;
        }

        function clearHighlights() {
            itemsLayer.querySelectorAll('.dress-target').forEach(el => el.classList.remove('dress-target'));
            itemsLayer.querySelectorAll('.fridge-target').forEach(el => el.classList.remove('fridge-target'));
        }

        // =========================================================================
        // 11. RESET / CLEAR / SOUND CONTROLS
        // =========================================================================
        function openConfirmModal(title, msg, onConfirm) {
            confirmTitle.textContent = title;
            confirmMsg.textContent = msg;
            pendingConfirmAction = onConfirm;
            confirmModal.classList.remove('hidden');
        }

        confirmCancel.addEventListener('click', () => {
            SoundFX.pop();
            confirmModal.classList.add('hidden');
            pendingConfirmAction = null;
        });

        confirmOk.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            if (pendingConfirmAction) pendingConfirmAction();
            pendingConfirmAction = null;
        });

        document.getElementById('btn-reset-room').addEventListener('click', () => {
            SoundFX.pop();
            openConfirmModal(
                'Reset Room Layout?',
                'Restore this room to its neat, tidy default arrangement?',
                () => {
                    SoundFX.sparkle();
                    roomStates[currentRoomId] = buildStarterState(currentRoomId);
                    deselectItem();
                    renderActiveRoom();
                    showToast('Room restored to a neat layout!');
                }
            );
        });

        document.getElementById('btn-clear-room').addEventListener('click', () => {
            SoundFX.pop();
            openConfirmModal(
                'Clear This Room?',
                'Remove all furniture and characters from this room so you can decorate from scratch?',
                () => {
                    SoundFX.trash();
                    roomStates[currentRoomId] = [];
                    deselectItem();
                    renderActiveRoom();
                    showToast('Room cleared! Open Catalog to decorate.');
                }
            );
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            const isMuted = SoundFX.toggleMute();
            document.getElementById('icon-sound-on').classList.toggle('hidden', isMuted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !isMuted);
            if (!isMuted) SoundFX.pop();
        });

        // =========================================================================
        // 12. INITIALIZE GAME
        // =========================================================================
        function init() {
            renderRoomNav();
            renderCatalogTabs();
            renderCatalogGrid();
            renderActiveRoom();
            setTimeout(() => showToast('Tap the Fridge and press Open (or double-tap it) to store cupcakes inside!'), 600);
        }

        window.addEventListener('load', init);
    })();
    </script>
</body>
